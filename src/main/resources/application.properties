spring.application.name=E-ComSync

# Server config
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ecomsync
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Schema Configuration
spring.jpa.properties.hibernate.default_schema=user_service

# JWT Configuration
app.jwtSecret=your-secret-key-here-must-be-at-least-256-bits-long
app.jwtExpirationInMs=86400000

# OpenAI Configuration (for chatbot)
openai.api.key=your-openai-api-key
openai.model=gpt-4o

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.ecomsync=DEBUG

# UTF-8
spring.datasource.hikari.connection-init-sql=SET NAMES 'UTF8'

# Allow circular references
spring.main.allow-circular-references=true

