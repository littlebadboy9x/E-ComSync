spring.application.name=E-ComSync

# Server config
server.port=8080

# Thay ??i c?u hình Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ecomsync
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Thay ??i JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thêm c?u hình schema
spring.jpa.properties.hibernate.default_schema=user_service

# JWT Configuration
jwt.secret=your-jwt-secret-key-should-be-very-long-and-secure-for-production-use
jwt.expiration=86400000

# OpenAI Configuration (for chatbot)
openai.api.key=your-openai-api-key
openai.model=gpt-4o

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.ecomsync=DEBUG

# UTF-8
spring.datasource.hikari.connection-init-sql=SET NAMES 'UTF8'

